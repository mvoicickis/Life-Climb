# Render Blueprint — optional helper for deploy settings.
# You can also configure the same values in the Render dashboard.

services:
  - type: web
    name: lifepoints
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lifepoints-db
          property: connectionString
      - key: APP_HOST
        sync: false

databases:
  - name: lifepoints-db
    plan: free
