<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <meta name="robots" content="noindex">
    <title>You're offline — LifePoints</title>
    <link rel="icon" href="/icon-192.png?v=8" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=8" sizes="180x180">
    <style>
      :root {
        color-scheme: light;
        --lp-paper: #f8fafc;
        --lp-ink: #0f172a;
        --lp-muted: #475569;
        --lp-green: #57d35b;
        --lp-border: rgba(15, 23, 42, 0.1);
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { min-height: 100%; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(120% 80% at 50% 0%, rgba(87, 211, 91, 0.12), transparent 55%),
          linear-gradient(180deg, #eef2f7 0%, var(--lp-paper) 55%, #e2e8f0 100%);
        color: var(--lp-ink);
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(24rem, 100%);
        padding: 1.75rem 1.5rem 1.5rem;
        border-radius: 1.15rem;
        border: 1px solid var(--lp-border);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        margin-bottom: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.01em;
      }
      .brand img {
        width: 2rem;
        height: 2rem;
        border-radius: 0.55rem;
      }
      h1 {
        font-family: Fraunces, Georgia, "Times New Roman", serif;
        font-size: clamp(1.35rem, 4vw, 1.7rem);
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 0.55rem;
      }
      p {
        color: var(--lp-muted);
        font-size: 0.98rem;
        line-height: 1.45;
        margin-bottom: 1.25rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.2rem;
        min-height: 2.75rem;
        min-width: 8rem;
        background: var(--lp-green);
        color: #06210c;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--lp-ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img src="/icon-192.png?v=8" width="32" height="32" alt="">
        <span>LifePoints</span>
      </div>
      <h1>You're offline</h1>
      <p>Reconnect to keep climbing. Your trail is waiting on the network.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
