name: Daily nudge

# Hourly at :17 UTC — app filters to each user's local morning (7–11) and evening (19–21) windows.
# Requires repo secrets: CRON_SECRET, APP_BASE_URL (e.g. https://lifeclimb.app)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  daily-nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger morning nudges
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ] || [ -z "${APP_BASE_URL}" ]; then
            echo "Missing CRON_SECRET or APP_BASE_URL repo secrets."
            exit 1
          fi
          curl -fsS --retry 3 --max-time 120 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            "${APP_BASE_URL%/}/notifications/morning_nudge"
          curl -fsS --retry 3 --max-time 120 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            "${APP_BASE_URL%/}/notifications/evening_nudge"
