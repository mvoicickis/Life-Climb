# SQLite locally; Postgres in production via DATABASE_URL (Render/Fly/etc.)

development:
  adapter: sqlite3
  database: storage/development.sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

test:
  adapter: sqlite3
  database: storage/test.sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# IMPORTANT: keep this flat (not nested under primary:) so db:prepare
# works on simple single-database hosts like Render.
production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV.fetch("DATABASE_URL") %>
